name: Verify App Template Android
description: >
  Scaffold a fresh project from the local template using the freshly built
  create-sparkling-app CLI and run `pnpm run:android` against the published
  Maven Central artifacts.

inputs:
  version:
    description: Release version (e.g. 2.1.0 or 2.1.0-rc.12)
    required: true
  node_version:
    description: Node.js version
    required: false
    default: '22.23.2'
  pnpm_version:
    description: pnpm version
    required: false
    default: '10.26.0'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        registry-url: 'https://registry.npmjs.org'

    # pnpm/action-setup is not on the tiktok org's allowed-actions list, so
    # install pnpm through Corepack instead.
    - name: Setup pnpm
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        PNPM_VERSION: ${{ inputs.pnpm_version }}
      run: |
        corepack enable
        corepack install --global "pnpm@${PNPM_VERSION}"
        pnpm_version=$(pnpm --version)
        echo "pnpm $pnpm_version"

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # android-actions/setup-android is not on the tiktok org's allowed-actions
    # list. GitHub-hosted ubuntu runners ship the Android SDK preinstalled
    # (ANDROID_HOME), so expose its tools on PATH and accept the licenses.
    - name: Setup Android SDK
      shell: bash
      run: |
        if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
          echo "::error::ANDROID_HOME is not set; expected a GitHub-hosted runner with the Android SDK preinstalled"
          exit 1
        fi
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Verify app template (Android)
      shell: bash
      run: |
        python3 scripts/verify_template.py \
          --platform android \
          --version "${{ inputs.version }}" \
          --workspace-dir "${{ runner.temp }}/sparkling-template-verify"
