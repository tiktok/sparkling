name: Publish iOS Pods
description: >
  Build iOS pod artifacts, upload zips to GitHub Release,
  and publish each pod to CocoaPods trunk in dependency order.

inputs:
  version:
    description: Release version (e.g. 2.1.0 or 2.1.0-rc.12)
    required: true
  is_rc:
    description: Whether this is a release candidate ('true' or 'false')
    required: true
  cocoapods_trunk_token:
    description: CocoaPods trunk authentication token
    required: true
  github_token:
    description: GitHub token for uploading release assets
    required: true

runs:
  using: composite
  steps:
    - name: Prepare environment
      shell: bash
      run: scripts/setup_ios_publish_env.sh

    - name: Update versions
      shell: bash
      run: |
        chmod +x scripts/update-all-version.sh
        ./scripts/update-all-version.sh ${{ inputs.version }}

    - name: Build iOS pod artifacts
      shell: bash
      run: |
        echo "📦 Building iOS pod artifacts for ${{ inputs.version }}..."
        python3 scripts/build_ios_pod_artifacts.py ${{ inputs.version }} --output-dir dist/ios
        echo "✅ iOS pod artifacts built"
        echo ""
        echo "Artifacts:"
        ls -lh dist/ios/

    # ncipollo/release-action is not on the tiktok org's allowed-actions list,
    # so use the gh CLI preinstalled on GitHub-hosted runners. Same behavior:
    # create the release (with generated notes) or update it if it exists,
    # then upload the zips, replacing assets with the same name.
    - name: Upload iOS zip assets to GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.version }}
        TARGET_SHA: ${{ github.sha }}
        PRERELEASE: ${{ inputs.is_rc == 'true' }}
      run: |
        title="Release ${TAG}"
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG exists; updating it."
          gh release edit "$TAG" --title "$title" --prerelease="$PRERELEASE"
        else
          echo "Creating release $TAG at $TARGET_SHA."
          gh release create "$TAG" --title "$title" --target "$TARGET_SHA" \
            --generate-notes --prerelease="$PRERELEASE"
        fi
        gh release upload "$TAG" dist/ios/*.zip --clobber

    - name: Publish pods to CocoaPods trunk
      shell: bash
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ inputs.cocoapods_trunk_token }}
      run: python3 scripts/publish_ios_cocoapods.py ${{ inputs.version }} --artifacts-dir dist/ios
